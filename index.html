<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <meta
      name="description"
      content="Ping is launching soon. Subscribe to get notified when we go live."
    />
    <meta
      name="keywords"
      content="coming soon, landing page, email signup, launch notification"
    />
    <meta name="author" content="Ruben de Man" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Ping coming soon page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="coming-soon">
        <header class="coming-soon__header">
          <img
            class="coming-soon__logo"
            src="./images/logo.svg"
            alt="Ping logo"
          />
          <h1 class="coming-soon__title">
            We are launching <span class="coming-soon__highlight">soon!</span>
          </h1>
          <p class="coming-soon__text">Subscribe and get notified</p>
        </header>
        <form action="#" class="form" id="form">
          <div class="form__group">
            <label for="email" class="sr-only">Email address</label>

            <input
              class="form__input"
              type="text"
              name="email"
              id="email"
              placeholder="Your email address…"
            />
            <p class="form__error">Please provide a valid email address</p>
          </div>
          <button class="form__button" type="submit">Notify Me</button>
        </form>
        <img
          class="coming-soon__image"
          src="./images/illustration-dashboard.png"
          alt="Dashboard preview"
        />
        <footer class="coming-soon__footer">
          <ul class="coming-soon__list">
            <li class="coming-soon__item">
              <a
                class="coming-soon__item-link"
                aria-label="Visit our Facebook page"
                href="#"
                ><img
                  class="coming-soon__item-icon"
                  src="./images/icon-facebook.svg"
                  alt="Facebook Icon"
              /></a>
            </li>
            <li class="coming-soon__item">
              <a
                class="coming-soon__item-link"
                aria-label="Visit our Twitter page"
                href="#"
                ><img
                  class="coming-soon__item-icon"
                  src="./images/icon-twitter.svg"
                  alt="Twitter Icon"
              /></a>
            </li>
            <li class="coming-soon__item">
              <a
                class="coming-soon__item-link"
                aria-label="Visit our Instagram page"
                href="#"
                ><img
                  class="coming-soon__item-icon"
                  src="./images/icon-instagram.svg"
                  alt="Instagram Icon"
              /></a>
            </li>
          </ul>
          <p>&copy; Copyright Ping. All rights reserved.</p>
        </footer>
      </section>
    </main>

    <footer class="attribution">
      <p class="attribution__text">
        Challenge by
        <a
          class="attribution__link"
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          class="attribution__link"
          href="https://rubendeman.nl"
          target="_blank"
          rel="noopener noreferrer"
          >Ruben de Man</a
        >.
      </p>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
